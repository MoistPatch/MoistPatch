# Tier legend
# ============================================================
# 1: Major national retailers          — broad range, less hardware-focused
# 2: Specialist PC/component retailers — primary scrape targets
# 3: Electronics/mixed retail          — peripherals, monitors, NAS
# 4: Manufacturer direct               — MSRP cross-reference
# 5: Refurbished/secondary market      — exclude from new-price comparison
# 6: Price comparison/aggregators      — potential shortcut for broad coverage

# Document notes preserved verbatim:
#   - Mwave under DigiDirect Group since June 2025 — pricing valid, stock unreliable.
