# Competitor and SKU configuration for Agent 1C (Price Intelligence).
#
# Two modes of operation:
#
#  1) Targeted SCAN — uses the `skus:` list below. Best for products you
#     specifically want to track (your hero SKUs). Validates against
#     `expected_price_min/max` per SKU.
#
#  2) Wide CRAWL — uses the per-competitor `sitemap_url` and
#     `product_url_patterns` fields. Discovers every product the site
#     publishes in its sitemap. Validates against the competitor-level
#     `crawl_price_min/max` sanity bounds.
#
# A SKU not present in `skus:` but discovered via crawl will be stored
# under a synthesised internal SKU: EXT-{COMPETITOR-INITIALS}-{external_id}.

competitors:
  - name: Centre Com
    domain: centrecom.com.au
    base_url: https://www.centrecom.com.au
    renderer: http
    rate_limit_min_s: 6
    rate_limit_max_s: 15
    enabled: true
    # Discovery
    sitemap_url: https://www.centrecom.com.au/sitemap.xml
    product_url_patterns:
      - "*/Product/*"
      - "*/product/*"
      - "*/products/*"
    crawl_default_currency: AUD
    crawl_price_min: 1
    crawl_price_max: 50000
    crawl_max_products: 200

  - name: PLE Computers
    domain: ple.com.au
    base_url: https://www.ple.com.au
    renderer: http
    rate_limit_min_s: 6
    rate_limit_max_s: 15
    enabled: true
    sitemap_url: https://www.ple.com.au/sitemap.xml
    product_url_patterns:
      - "*/Products/*"
      - "*/products/*"
      - "*/PartDetail/*"
    crawl_default_currency: AUD
    crawl_price_min: 1
    crawl_price_max: 50000
    crawl_max_products: 200

  - name: Scorptec
    domain: scorptec.com.au
    base_url: https://www.scorptec.com.au
    renderer: http
    rate_limit_min_s: 8
    rate_limit_max_s: 18
    enabled: true
    # Scorptec uses Cloudflare; sitemap may or may not be reachable.
    # If sitemap_url returns 403/503 the crawler logs the failure cleanly
    # — that's still useful diagnostic data.
    sitemap_url: https://www.scorptec.com.au/sitemap.xml
    product_url_patterns:
      - "*/product/*"
    crawl_default_currency: AUD
    crawl_price_min: 1
    crawl_price_max: 50000
    crawl_max_products: 200

  - name: Mwave
    domain: mwave.com.au
    base_url: https://www.mwave.com.au
    renderer: http
    rate_limit_min_s: 8
    rate_limit_max_s: 18
    enabled: true
    sitemap_url: https://www.mwave.com.au/sitemap.xml
    product_url_patterns:
      - "*/product/*"
      - "*/au-en/product/*"
    crawl_default_currency: AUD
    crawl_price_min: 1
    crawl_price_max: 50000
    crawl_max_products: 200

  - name: Umart
    domain: umart.com.au
    base_url: https://www.umart.com.au
    renderer: http
    rate_limit_min_s: 6
    rate_limit_max_s: 15
    enabled: true
    sitemap_url: https://www.umart.com.au/sitemap.xml
    product_url_patterns:
      - "*/pro/*"
      - "*/product/*"
    crawl_default_currency: AUD
    crawl_price_min: 1
    crawl_price_max: 50000
    crawl_max_products: 200

# ------------------------------------------------------------------
# Targeted SKUs — optional. Used by `scan`, not by `crawl`.
# Replace each url with an actual product page URL on that competitor
# before flipping enabled: true.
# ------------------------------------------------------------------
skus:
  - our_sku: NH-RTX5090
    competitor: Centre Com
    product_name: NVIDIA GeForce RTX 5090 24GB
    category: gpu
    url: https://www.centrecom.com.au/search?q=rtx+5090
    expected_price_min: 2500
    expected_price_max: 5500
    enabled: false

  - our_sku: NH-RTX5090
    competitor: Mwave
    product_name: NVIDIA GeForce RTX 5090 24GB
    category: gpu
    url: https://www.mwave.com.au/search?keywords=rtx+5090
    expected_price_min: 2500
    expected_price_max: 5500
    enabled: false
