# Active competitor configuration for Agent 1C (Price Intelligence).
# ----------------------------------------------------------------------
# Source of truth for what the crawler will actually fetch.
# The full 47-retailer catalogue (with tier/notes/priority metadata) is
# in `config/au_retailers.yaml` — promote retailers from there to here
# as you bring them online.
#
# Modes:
#   scan  — uses `skus:` list; pre-defined products with validation bounds
#   crawl — uses each competitor's sitemap + product_url_patterns
#
# All 19 Tier 2 specialists below are wired in with reasonable defaults.
# Patterns are educated guesses; test each with --limit 5 first and
# tune product_url_patterns if needed.

competitors:

  # ---------- already-tuned originals ----------
  - name: Centre Com
    domain: centrecom.com.au
    base_url: https://www.centrecom.com.au
    sitemap_url: https://www.centrecom.com.au/sitemap.xml
    product_url_patterns: ["*/Product/*", "*/product/*", "*/products/*"]
    rate_limit_min_s: 6
    rate_limit_max_s: 15
    crawl_default_currency: AUD
    crawl_price_min: 1
    crawl_price_max: 50000
    crawl_max_products: 200
    enabled: true

  - name: PLE Computers
